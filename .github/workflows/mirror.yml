on:
  push:
    branches:
      - "main"

permissions:
  contents: write

jobs:
  mirror_job:
    runs-on: ubuntu-latest
    name: Mirror `main` branch to `comment` branch
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Mirror main to comment
        run: git push --force origin main:comment
